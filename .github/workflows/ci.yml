name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1 -race
      - name: build
        run: go build ./...
      # The CLI contract from conventions.md: these three flags must work.
      - name: CLI contract
        run: |
          go build -o blurter .
          ./blurter --version
          ./blurter --help
          ./blurter --help-agent | head -5
