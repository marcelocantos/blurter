name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1 -race
      - name: build
        run: go build ./...
      # The CLI contract from conventions.md: these three flags must work.
      - name: CLI contract
        run: |
          go build -o blurter .
          ./blurter --version
          ./blurter --help
          ./blurter --help-agent | head -5
      - name: Supervisor scripts (macOS Bash 3.2)
        if: runner.os == 'macOS'
        run: |
          test "$(/bin/bash -c 'echo ${BASH_VERSINFO[0]}')" = 3
          /bin/bash -n supervisor/install.sh supervisor/run-blurter.sh
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          SUPERVISOR_CONF_DIR="$temp_dir" SUPERVISOR_SKIP_CTL=1 /bin/bash supervisor/install.sh
          test -f "$temp_dir/blurter.ini"
          test "$(BLURTER_BIN=/usr/bin/true /bin/bash supervisor/run-blurter.sh --print-bin)" = /usr/bin/true
