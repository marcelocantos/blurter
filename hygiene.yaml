# hygiene.yaml — declared, drift-validated hygiene posture for blurter.
# Schema reference: the `hygiene` skill (~/.claude/skills/hygiene/SKILL.md).
# Validate with `/hygiene`; aggregate the fleet with `/hygiene fleet`. Tracks
# steady-state ("we maintain X"), the complement to bullseye's aspirational
# targets ("achieve X").
#
# Tiers are PER DIMENSION (schema v1): a dimension's held tier is the highest T
# such that every item in it with tier <= T is satisfied. `floors` is the
# per-dimension ratchet (below floor => DRIFT); `aspires` is the gap horizon;
# `enforce` is intent-only and does not affect tiers.

schema_version: 1

repo: blurter
aspires: 3
floors:            # per-dimension held-tier ratchet; below floor => DRIFT
  correctness: 2
  security: 2
  quality: 2
  deps: 2
  release: 2
  governance: 2
  build: 2
  docs: 1          # product docs present; no docs-in-CI / CHANGELOG yet
  perf: 0          # no benchmark suite
  vcs: 1           # default branch is master; branch protection is not
  agent: 2

tiers:
  1: baseline    # LICENSE + README + .gitignore; tests build & run
  2: maintained  # matrix, lint/format, release + governance
  3: hardened    # security scanning, SBOM/signing, fuzzing, perf, branch gates

items:

  # ============================== CORRECTNESS =============================
  - id: correctness.make-test
    dim: correctness
    desc: Makefile `test` target runs `go test ./...`
    state: present
    cadence: continuous
    enforce: blocking
    tier: 1
    evidence: {make_target: test}

  - id: correctness.test-matrix
    dim: correctness
    desc: go test -race on ubuntu-latest and macos-latest (ci.yml `test` job)
    state: enforced
    cadence: continuous
    enforce: blocking
    tier: 2
    evidence: {ci_job: ci.yml#test}

  - id: correctness.cli-contract
    dim: correctness
    desc: "--version, --help, and --help-agent work (CI CLI contract)"
    state: enforced
    cadence: continuous
    enforce: blocking
    tier: 2
    evidence: {ci_step: {workflow: ci.yml, name: CLI contract}}

  - id: correctness.fuzzing
    dim: correctness
    desc: Fuzz harnesses over policy/event parsers
    state: planned
    cadence: continuous
    enforce: informational
    tier: 3
    reason: Small surface (YAML config + JSON events); unit tests cover Decide/Spool. No fuzz targets yet.
    evidence: {absent: {make_target: fuzz}}

  # =========================== SECURITY / SUPPLY ==========================
  - id: security.secrets-gitignored
    dim: security
    desc: Token/credential paths are gitignored (slack-token, *.token, .env)
    state: present
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {file: {path: .gitignore, matches: 'slack-token'}}

  - id: security.dep-pinning
    dim: security
    desc: go.sum committed — reproducible, pinned module graph
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {file: {path: go.sum}}

  - id: security.token-mode
    dim: security
    desc: Slack token file is refused unless mode 600 or stricter
    state: enforced
    cadence: continuous
    enforce: blocking
    tier: 2
    evidence: {file: {path: drain_test.go, matches: 'TestSlackTokenRefusesLoosePermissions'}}

  - id: security.secret-scan
    dim: security
    desc: GitHub secret scanning is enabled on the repo
    state: enforced
    cadence: once-must-hold
    enforce: blocking
    tier: 3
    evidence: {gh_setting: {key: security_and_analysis.secret_scanning.status, equals: enabled}}

  - id: security.push-protection
    dim: security
    desc: Secret-scanning push protection is enabled
    state: enforced
    cadence: once-must-hold
    enforce: blocking
    tier: 3
    evidence: {gh_setting: {key: security_and_analysis.secret_scanning_push_protection.status, equals: enabled}}

  - id: security.gitleaks
    dim: security
    desc: gitleaks scanner in CI
    state: skipped
    cadence: continuous
    enforce: informational
    tier: 3
    reason: >-
      GitHub native secret scanning and push protection are enabled; a second
      gitleaks job would duplicate that gate. Reclassify if a local/CI scanner
      is added.
    evidence: {absent: {scanner: {tool: gitleaks}}}

  - id: security.vuln-scan
    dim: security
    desc: govulncheck (or equivalent) runs in CI over the module
    state: planned
    cadence: periodic:30d
    enforce: warning
    tier: 3
    reason: No govulncheck job; Dependabot security updates are disabled. One third-party dep (yaml.v3).
    evidence: {absent: {scanner: {tool: govulncheck}}}

  - id: security.dependabot
    dim: security
    desc: Dependabot (or equivalent) watches gomod for advisories
    state: planned
    cadence: periodic:30d
    enforce: warning
    tier: 3
    reason: No .github/dependabot.yml; Dependabot security updates disabled on the repo.
    evidence: {absent: {file: {path: .github/dependabot.yml}}}

  - id: security.sast-codeql
    dim: security
    desc: CodeQL static analysis for Go
    state: planned
    cadence: continuous
    enforce: informational
    tier: 3
    reason: No CodeQL workflow; go vet + tests are the current static net.
    evidence: {absent: {ci_job: "ci.yml#codeql"}}

  - id: security.actions-perms
    dim: security
    desc: GitHub Actions default token permissions scoped to least privilege
    state: planned
    cadence: once-must-hold
    enforce: warning
    tier: 3
    reason: >-
      ci.yml has no top-level permissions block; release.yml sets
      `contents: write` on the whole workflow, including the matrix build.
    evidence: {absent: {ci_step: {workflow: ci.yml, name: permissions}}}

  - id: security.signed-releases
    dim: security
    desc: Release artifacts carry provenance / are signed (cosign/sigstore)
    state: planned
    cadence: per-release
    enforce: informational
    tier: 3
    reason: release.yml uploads tarballs via `gh release upload`; no signing/attestation step.
    evidence: {absent: {ci_step: {workflow: release.yml, name: Sign}}}

  # ============================== CODE QUALITY ============================
  - id: quality.format
    dim: quality
    desc: Sources are gofmt-clean, enforced in CI
    state: enforced
    cadence: continuous
    enforce: blocking
    tier: 2
    evidence: {ci_step: {workflow: ci.yml, name: gofmt}}

  - id: quality.vet
    dim: quality
    desc: go vet runs in CI on every push/PR
    state: enforced
    cadence: continuous
    enforce: blocking
    tier: 2
    evidence: {ci_step: {workflow: ci.yml, name: vet}}

  - id: quality.lint-make
    dim: quality
    desc: Makefile `lint` target fails if gofmt -l is non-empty
    state: present
    cadence: continuous
    enforce: warning
    tier: 2
    evidence: {make_target: lint}

  - id: quality.staticcheck
    dim: quality
    desc: staticcheck (or golangci-lint) runs in CI
    state: planned
    cadence: continuous
    enforce: informational
    tier: 3
    reason: CI is gofmt + go vet only; staticcheck is not wired and the local binary is on an older toolchain.
    evidence: {absent: {ci_step: {workflow: ci.yml, name: staticcheck}}}

  # =========================== DEPENDENCY HEALTH ==========================
  - id: deps.go-sum
    dim: deps
    desc: go.sum is committed so module versions are pinned
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 2
    evidence: {file: {path: go.sum, matches: 'gopkg.in/yaml.v3'}}

  - id: deps.dependabot
    dim: deps
    desc: Automated gomod update PRs (Dependabot)
    state: planned
    cadence: periodic:30d
    enforce: informational
    tier: 3
    reason: No Dependabot config; yaml.v3 is reviewed by hand at release if at all.
    evidence: {absent: {file: {path: .github/dependabot.yml}}}

  # ========================== RELEASE & VERSIONING =======================
  - id: release.ci-built
    dim: release
    desc: Release binaries are CI-cross-compiled (darwin-arm64, linux-amd64, linux-arm64), never locally
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {ci_job: release.yml#build}

  - id: release.homebrew
    dim: release
    desc: Published to the Homebrew tap on release
    state: present
    cadence: per-release
    enforce: informational
    tier: 2
    evidence: {ci_job: release.yml#homebrew}

  - id: release.semver-minor
    dim: release
    desc: Git tags are MINOR-only (vMAJOR.MINOR.0)
    state: present
    cadence: per-release
    enforce: blocking
    tier: 2
    evidence:
      command: test -z "$(git tag -l 'v*' | grep -vE '^v[0-9]+\.[0-9]+\.0$')"

  - id: release.changelog
    dim: release
    desc: A maintained CHANGELOG records user-visible changes per release
    state: planned
    cadence: per-release
    enforce: warning
    tier: 3
    reason: History lives in git + GitHub release notes; no curated CHANGELOG.md yet.
    evidence: {absent: {file: {path: CHANGELOG.md}}}

  # ============================ GOVERNANCE / META ========================
  - id: governance.license
    dim: governance
    desc: Apache-2.0 LICENSE present
    state: present
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {file: {path: LICENSE, matches: 'Apache License'}}

  - id: governance.readme
    dim: governance
    desc: README present
    state: present
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {file: {path: README.md}}

  - id: governance.gitignore
    dim: governance
    desc: .gitignore covers build artifacts, credentials, IDE/OS files
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: .gitignore}}

  - id: governance.squash-only
    dim: governance
    desc: Repo is squash-merge only, with delete-branch-on-merge
    state: enforced
    cadence: once-must-hold
    enforce: blocking
    tier: 2
    evidence: {gh_setting: {key: allow_merge_commit, equals: false}}

  - id: governance.delete-branch
    dim: governance
    desc: Head branch is deleted on merge
    state: enforced
    cadence: once-must-hold
    enforce: warning
    tier: 2
    evidence: {gh_setting: {key: delete_branch_on_merge, equals: true}}

  - id: governance.security-md
    dim: governance
    desc: SECURITY.md documents the vulnerability-disclosure process
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: Public repo without a published disclosure policy yet.
    evidence: {absent: {file: {path: SECURITY.md}}}

  - id: governance.codeowners
    dim: governance
    desc: CODEOWNERS names reviewers for the tree
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: Sole-owner repo; no CODEOWNERS file. Review is the owner, not a roster.
    evidence: {absent: {file: {path: CODEOWNERS}}}

  - id: governance.notice
    dim: governance
    desc: Third-party attribution NOTICE for Go module dependencies
    state: planned
    cadence: per-release
    enforce: informational
    tier: 3
    reason: Single dep (yaml.v3); no NOTICE yet.
    evidence: {absent: {file: {path: NOTICE}}}

  # ================================= BUILD ===============================
  - id: build.go-version
    dim: build
    desc: Go toolchain pinned in go.mod (go 1.26)
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 2
    evidence: {file: {path: go.mod, matches: '(?m)^go 1\.26$'}}

  - id: build.makefile
    dim: build
    desc: Makefile exposes build/test/vet/lint/install
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 2
    evidence: {make_target: build}

  - id: build.cross-compile
    dim: build
    desc: Release builds are CGO_ENABLED=0 cross-compiles from one runner
    state: present
    cadence: per-release
    enforce: informational
    tier: 2
    evidence: {file: {path: .github/workflows/release.yml, matches: 'CGO_ENABLED: "0"'}}

  - id: build.gowork-off
    dim: build
    desc: Makefile test/vet recipes set GOWORK=off so a parent go.work cannot break local oracles
    state: planned
    cadence: once-must-hold
    enforce: warning
    tier: 3
    reason: >-
      Parent ~/work/github.com/marcelocantos/go.work does not list this module;
      `make test` fails here unless GOWORK=off. CI is green (no parent workspace).
    evidence: {absent: {file: {path: Makefile, matches: 'GOWORK=off'}}}

  # ============================ DOCUMENTATION ============================
  - id: docs.stability
    dim: docs
    desc: STABILITY.md records the shipped (not intended) contract
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: Not on master; a sibling docs branch drafts it. Product contract currently lives in README + agents-guide.md.
    evidence: {absent: {file: {path: STABILITY.md}}}

  - id: docs.agents-guide
    dim: docs
    desc: agents-guide.md is the product-facing agent doc (embedded in the binary)
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 1
    evidence: {file: {path: agents-guide.md}}

  - id: docs.todo
    dim: docs
    desc: docs/TODO.md is not the work ledger (bullseye.yaml is)
    state: skipped
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: Global convention bans TODO.md; bullseye.yaml is the intent ledger.
    evidence: {absent: {file: {path: docs/TODO.md}}}

  - id: docs.md-links
    dim: docs
    desc: Internal markdown links resolve in CI
    state: planned
    cadence: continuous
    enforce: informational
    tier: 3
    reason: No markdown-link check target or CI step.
    evidence: {absent: {make_target: check-md-links}}

  # ============================== PERFORMANCE ===========================
  - id: perf.benchmarks
    dim: perf
    desc: Benchmark suite exists
    state: planned
    cadence: per-release
    enforce: informational
    tier: 3
    reason: Local daemon; no benches. Performance is not a tracked property.
    evidence: {absent: {make_target: bench}}

  # ============================== VCS / HISTORY =========================
  - id: vcs.default-branch
    dim: vcs
    desc: Default branch is master
    state: enforced
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {gh_setting: {key: default_branch, equals: master}}

  - id: vcs.branch-protection
    dim: vcs
    desc: master is protected and requires the CI `test` job
    state: planned
    cadence: once-must-hold
    enforce: warning
    tier: 3
    reason: Branch protection 404; CI runs on push/PR but is not a required check.
    evidence:
      absent:
        command: gh api repos/marcelocantos/blurter/branches/master/protection --jq .url

  - id: vcs.pre-commit-hook
    dim: vcs
    desc: Committed git hooks (scripts/hooks) gate locally before commit
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: No scripts/hooks; core.hooksPath is the default .git/hooks.
    evidence: {absent: {file: {path: scripts/hooks/pre-commit}}}

  # =================== AGENT-READINESS / ONBOARDING ====================
  - id: agent.agents-guide
    dim: agent
    desc: agents-guide.md present and embedded (`go:embed`) for `--help-agent`
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: main.go, matches: 'go:embed agents-guide.md'}}

  - id: agent.bullseye
    dim: agent
    desc: bullseye.yaml present (convergence targets discoverable)
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: bullseye.yaml}}

  - id: agent.cli-help
    dim: agent
    desc: Binary exposes --version, --help, and --help-agent (CI CLI contract)
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {ci_step: {workflow: ci.yml, name: CLI contract}}

  - id: agent.claude-md
    dim: agent
    desc: Repo-level AGENTS.md / CLAUDE.md for coding-agent conventions
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: >-
      No AGENTS.md or CLAUDE.md; agents-guide.md is the product-facing
      substitute, not a coding-agent instruction file.
    evidence: {absent: {file: {path: AGENTS.md}}}
