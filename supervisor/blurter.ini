; blurter delivery daemon. supervisor/install.sh expands @REPO@.
; The daemon uses the installed Homebrew binary, not a checkout build.

[program:blurter]
command=@REPO@/supervisor/run-blurter.sh
directory=@REPO@
environment=HOME="%(ENV_HOME)s",USER="%(ENV_USER)s",PATH="/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:%(ENV_HOME)s/.local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=15
stdout_logfile=%(ENV_HOME)s/.local/var/log/blurter.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
