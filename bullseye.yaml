  T3.8:
    name: Supply-chain and merge gates are thin for a credential-owning daemon
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - '`gh api .../vulnerability-alerts` not 404; a PR with'
    - failing tests cannot merge.
    - 'ENT-008 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-008 (P3). Status: observed fact. A Slack bot token is the crown jewel of this process. Runtime handling is careful; the GitHub-side update/vuln loop is off, and merges are not mechanically blocked on CI. The risk is stale `yaml.v3` or a force-push of red CI, not a present leak. Remediation: Enable vulnerability alerts + Dependabot for `gomod`; add a `govulncheck` CI step; require the existing `test` job on `master`. Leave `skip_checksum` unless homebrew-releaser needs it — artifacts are checksummed in the formula today. Blast: One Go module, one third-party dependency. Low until yaml.v3 or the Go stdlib HTTP stack has a CVE. Report: docs/audits/entropy-audit-2026-08-22.md.'
