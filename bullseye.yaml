  T3.5:
    name: Unreadable spool files are logged forever and never parked
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - Write `{ not json` as `spool/000.json`, `DrainOnce`,
    - assert spool empty, `parked/` has the file, audit contains `unreadable`.
    - 'ENT-005 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-005 (P2). Status: observed fact. A corrupt `*.json` produces `SPOOL ERROR` every poll (default 5s) until a human deletes it. It is never delivered, never parked, never surfaced in CLI status (ENT-003). The project''s own rule — never silently skip an unreadable spool file — is met as a log line and then abandoned. Remediation: On read/parse/validate error, `park` the file (same as permanent delivery failure) and audit `parked: unreadable`. Blast: One bad file: log spam + a "pending" count that does not include it (`readSpool` skips it, so `status` pending can read 0 while the directory is not empty). Report: docs/audits/entropy-audit-2026-08-22.md.'
