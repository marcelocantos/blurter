schema_version: 5
targets:
  T1:
    name: blurter delivers spooled notifications reliably, and nothing that submits an event holds a credential or blocks on the network
    status: achieved
    value: 5.0
    cost: 3.0
    acceptance:
    - '`blurter send` writes a durable atomic event (temp + fsync + rename) and exits without touching the network or reading any credential.'
    - The daemon delivers with retry, distinguishing transient failures (no network, 5xx, rate limit) from permanent ones (invalid_auth, missing_scope) so a misconfiguration is not retried forever.
    - Delivery state is recorded only after a sink confirms, so an alert raised while offline is delivered later rather than dropped and marked sent.
    - Undeliverable events are parked on disk, never deleted — blurter's own failure cannot destroy an alert.
    - Policy (dedup, re-notify window, recovery notice, min-severity, mute) is per-app, so one app can neither suppress nor falsely recover another.
    - Every decision including each suppression and its reason is recorded in an append-only audit log.
    - The Slack token is refused unless mode 600 or stricter; config resolves from $XDG_CONFIG_HOME, never from the install prefix.
    - --version, --help and --help-agent all work, per the CLI contract.
    - CI is green on macOS and Linux with go vet, gofmt and -race.
    context: |-
      Motivated by a concrete incident: the ytt scheduler's own notifier recorded an alert as sent even when no sink was reachable, so an alert raised in a no-network window was dropped AND suppressed by dedup. Its DM target also lived only in the environment, so an ad-hoc run silently downgraded to a local banner. Both are instances of the same class — notification logic reimplemented per app, each time slightly wrong — which is what a single owner of the concern fixes.

      The spool is the load-bearing decision: it makes submission durable, instant and credential-free, and turns delivery into at-least-once rather than at-most-once. Every other property here follows from it.
    origin: bullseye_init
    discovered: 2026-07-26
    achieved: 2026-07-27
  T2:
    name: ytt notifies exclusively through blurter, with no notification code of its own
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - ytt's scripts/playlist-ingest/notify.sh is deleted; ingest.sh reports events via `blurter send` and holds no token, no dedup state, and no sink logic.
    - The ytt Homebrew formula declares blurter as a dependency, and ytt's docs describe reporting events rather than configuring Slack.
    - ytt's alert-related bats cases are replaced by assertions that the right events are submitted, with delivery covered by blurter's own tests.
    - A real unhealthy ytt run delivers a Slack DM through blurter end-to-end, verified with an actual message rather than mocks.
    context: |-
      Decided 2026-07-26: a hard dependency rather than a fallback. ytt keeping its own notifier "just in case" would preserve the duplicated, subtly-wrong logic that blurter exists to remove, and two delivery paths means the weaker one is what runs when it matters. Accepting blurter as a single point of failure for alerting is the deliberate trade; the spool is what makes it tolerable, since events survive the daemon being down.

      Blocked on T1 so ytt is not migrated onto an interface that is still moving.
    depends_on:
    - T1
    origin: manual
    discovered: 2026-07-26
    achieved: 2026-07-27
  T4:
    name: min_severity never suppresses recovery notices
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: go test ./... -run 'TestDecideRecoveryFiresDespiteMinSeverity|TestDrainMinSeverityDoesNotClearOutstandingProblem' -count=1 red on master (Deliver:false Reason:severity ok below configured minimum problem; drain sink saw 1). Green after moving the min-severity guard below the SeverityOK recovery branch and skipping LastStatus overwrite on lower-rank suppressions. make test + make vet green.
    acceptance:
    - 'Decide(ok, AppPolicy{MinSeverity: problem}, prevProblem) delivers with Subject prefixed RECOVERED —'
    - A below-min info after a delivered problem does not clear LastStatus; a later ok still delivers as RECOVERED
    - README and agents-guide state that min_severity filters informational chatter and never suppresses recovery
    context: 'Entropy audit ENT-002. min_severity was applied before the recovery branch, and ok ranks below problem, so the documented min_severity: problem config silently dropped every RECOVERED notice. RecordSuppressed also overwrote LastStatus with the dropped info, so even fixing Decide alone left the drain path silent.'
    origin: entropy-audit ENT-002
    discovered: 2026-09-12
    achieved: 2026-09-12
