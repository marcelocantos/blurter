  T3.1:
    name: Retry backoff is keyed off event creation time, so aged spool entries burn `maxAttempts` and park
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - Drain an event with `CreatedAt = now-2h`, sink always
    - 'transient-fail, advance `Now` by 5s per `DrainOnce` for 12 calls: event'
    - must remain in the spool (deferred), not in `parked/`. A regression parks
    - it.
    - 'ENT-001 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-001 (P1). Status: observed fact. An event raised while the machine is offline has a `CreatedAt` hours in the past. When Slack is still 5xx (or the network is flapping), every 5s drain sees `now - CreatedAt` already greater than `backoff(n-1)`, so it never defers. Twelve attempts later (`daemon.go:136-144`) the event is **parked** as "gave up after 12 attempts". Parked files are not retried. The spool''s at-least-once promise degrades to "at most ~60s of rapid retries after a long wait, then human salvage." Remediation: Keep attempt count in memory as `{n, lastAttempt}` and compare `now.Sub(lastAttempt)` to `backoff(n-1)`. Do not rewrite spool files. On restart, empty map ⇒ retry immediately (preserve the documented restart behaviour). Blast: Every event that ages in the spool before a transient failure clears — the outage case T1 exists to handle (`bullseye.yaml` T1 acceptance: retry transient failures; deliver later… Report: docs/audits/entropy-audit-2026-08-22.md.'
    tags:
    - entropy-audit
    - ent-001
    - p1
    origin: entropy-audit 2026-08-22
    discovered: 2026-08-22
  T3.2:
    name: '`min_severity` is applied before recovery, and `ok` ranks below `problem`'
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - '`Decide(ok, AppPolicy{MinSeverity: problem, ...}, prevProblem, now)`'
    - 'must `Deliver` with a `RECOVERED` subject. Drain path: problem delivered,'
    - 'info suppressed, ok must still recover. Regression: ok suppressed with'
    - reason `below configured minimum`.
    - 'ENT-002 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-002 (P1). Status: observed fact. For the documented `min_severity: problem` app, `ok` has rank 1 < 2, so recovery is suppressed as "below configured minimum". The human gets problems and never a `RECOVERED` notice. T1 acceptance requires per-app recovery notices (`bullseye.yaml` T1). Remediation: Apply `min_severity` only to `info` (or skip the check when `e.Severity==ok` and a problem is outstanding). Stop calling `RecordSuppressed` for below-min events, or do not let those events change `LastStatus`. Align the README comment with the rule. Blast: Any app section with `min_severity: problem` (the documented way to quiet a chatty app). Mute is a separate, explicit silence; this one is accidental. Report: docs/audits/entropy-audit-2026-08-22.md.'
    tags:
    - entropy-audit
    - ent-002
    - p1
    origin: entropy-audit 2026-08-22
    discovered: 2026-08-22
